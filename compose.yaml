services:

    webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      APP_PORT: 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 5s
      timeout: 3s
      retries: 5

    test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/tests
    environment:
      BASE_URL: http://webapp:5000
      HEADLESS: "true"
    depends_on:
      webapp:
        condition: service_healthy
    command: pytest framework/tests -m "not deployment_smoke" -v