<!DOCTYPE html>
<html>

<head>
    <title>Confirm Dialog Demo</title>
</head>

<body>

<h2>Confirm Dialog Demo</h2>

<button onclick="deleteRecord()">
    Delete Record
</button>

<p id="result"></p>

<script>

function deleteRecord() {

    let response = confirm("Are you sure you want to delete this record?");

    if(response){
        document.getElementById("result").innerText = "Record Deleted";
    }
    else{
        document.getElementById("result").innerText = "Deletion Cancelled";
    }

}

</script>

</body>

</html>
