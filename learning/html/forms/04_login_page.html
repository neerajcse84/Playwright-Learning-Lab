<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>
</head>

<body>

    <h1>Playwright Learning Lab</h1>

    <form>

        <label for="username">Username</label>
        <input
            id="username"
            type="text"
            placeholder="Enter Username">

        <br><br>

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            placeholder="Enter Password">

        <br><br>

        <input
            id="remember"
            type="checkbox">

        <label for="remember">Remember Me</label>

        <br><br>

        <button type="submit">
            Login
        </button>

        <br><br>

        <a href="#">Forgot Password?</a>

    </form>

</body>

</html>
