<!DOCTYPE html>
<html>

<head>
    <title>Checkbox and Radio Demo</title>
</head>

<body>

    <h1>Playwright Checkbox & Radio Button Demo</h1>

    <h2>Choose your skills</h2>

    <label>
        <input type="checkbox" id="python">
        Python
    </label>

    <br><br>

    <label>
        <input type="checkbox" id="playwright">
        Playwright
    </label>

    <br><br>

    <label>
        <input type="checkbox" id="docker" checked>
        Docker
    </label>

    <hr>

    <h2>Experience Level</h2>

    <label>
        <input type="radio" name="experience" value="beginner">
        Beginner
    </label>

    <br>

    <label>
        <input type="radio" name="experience" value="intermediate">
        Intermediate
    </label>

    <br>

    <label>
        <input type="radio" name="experience" value="expert">
        Expert
    </label>

</body>

</html>
